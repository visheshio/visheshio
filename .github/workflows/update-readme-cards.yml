name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=radical&include_all_commits=true&hide_border=true&bg_color=0d1117&title_color=00f5ff&icon_color=ff00d4&text_color=ffffff
          path: profile/stats.svg
          token: ${{ secrets.GRS_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=radical&hide_border=true&bg_color=0d1117&title_color=00f5ff&text_color=ffffff&langs_count=10
          path: profile/top-langs.svg
          token: ${{ secrets.GRS_TOKEN }}

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=radical&hide_border=true&background=0d1117&stroke=00f5ff&ring=ff00d4&fire=ffb400&currStreakLabel=00f5ff
          path: profile/streak.svg
          token: ${{ secrets.GRS_TOKEN }}

      - name: Generate trophy
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: visheshio
          output_path: profile/trophy.svg
          token: ${{ secrets.GRS_TOKEN }}

      - name: Generate pin card - PROJECT_ONE
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=visheshio&repo=build-productivity-hub&theme=radical&hide_border=true&bg_color=0d1117&title_color=00f5ff&icon_color=ff00d4
          path: profile/pin-project-one.svg
          token: ${{ secrets.GRS_TOKEN }}

      - name: Generate pin card - PROJECT_TWO
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=visheshio&repo=trading-bot&theme=radical&hide_border=true&bg_color=0d1117&title_color=00f5ff&icon_color=ff00d4
          path: profile/pin-project-two.svg
          token: ${{ secrets.GRS_TOKEN }}

      - name: Generate pin card - PROJECT_THREE
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=visheshio&repo=Spotifyclone&theme=radical&hide_border=true&bg_color=0d1117&title_color=00f5ff&icon_color=ff00d4
          path: profile/pin-project-three.svg
          token: ${{ secrets.GRS_TOKEN }}

      - name: Generate pin card - PROJECT_FOUR
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=visheshio&repo=advanced-airbnb-clone&theme=radical&hide_border=true&bg_color=0d1117&title_color=00f5ff&icon_color=ff00d4
          path: profile/pin-project-four.svg
          token: ${{ secrets.GRS_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README stat cards" || exit 0
          git push
